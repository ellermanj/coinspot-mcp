version = 0.1

[default.global.parameters]
stack_name = "coinspot-mcp"
region = "ap-southeast-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "AllowTrading=false AllowWithdrawals=false"
# McpAuthToken must be supplied at deploy time (required, min length 16).

[default.package.parameters]
resolve_s3 = true
